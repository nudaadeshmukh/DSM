<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile - LogiBrain</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

  <div class="glass-card form-card">

    <!-- Back Button -->
    <button onclick="goBack()" class="btn btn-primary">← Dashboard</button>

    <div class="form-header">
      <h1>Profile</h1>
    </div>

    <!-- Profile Avatar -->
    <div class="profile-avatar" id="avatar">?</div>

    <!-- User Info -->
    <div class="profile-info-box">
      <p><strong>Name:</strong> <span id="name"></span></p>
      <p><strong>Email:</strong> <span id="email"></span></p>
    </div>

    <!-- Change Password -->
    <form onsubmit="changePassword(event)">

      <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="currentPassword" class="form-input" required>
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" class="form-input" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-input" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%">
        Update Password
      </button>

    </form>

    <p id="msg"></p>

  </div>

</div>

<script>
// ✅ Load user safely
const user = JSON.parse(localStorage.getItem("user"));

if (!user || !user.username) {
  // ❌ No user → redirect to login
  window.location.href = "login.html";
} else {
  // ✅ Set profile data
  document.getElementById("name").innerText = user.username;
  document.getElementById("email").innerText = user.email;

  // Avatar first letter
  document.getElementById("avatar").innerText =
    user.username.charAt(0).toUpperCase();
}

// 🔐 Change Password (Frontend only demo)
function changePassword(e) {
  e.preventDefault();

  const current = document.getElementById("currentPassword").value;
  const newPass = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const msg = document.getElementById("msg");

  let storedUser = JSON.parse(localStorage.getItem("user"));

  // ⚠️ Demo fallback password (remove in real app)
  if (!storedUser.password) storedUser.password = "1234";

  if (current !== storedUser.password) {
    msg.innerText = "Wrong current password";
    msg.style.color = "red";
    return;
  }

  if (newPass !== confirm) {
    msg.innerText = "Password mismatch";
    msg.style.color = "red";
    return;
  }

  // Update locally
  storedUser.password = newPass;
  localStorage.setItem("user", JSON.stringify(storedUser));

  msg.innerText = "Password updated successfully";
  msg.style.color = "lightgreen";
}

// 🔙 Back button
function goBack() {
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
