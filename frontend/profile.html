<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile - Supply Chain</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

  <div class="glass-card form-card">

    <!-- Back Button -->
    <button onclick="goBack()" class="btn btn-primary" >← Dashboard</button>

    <div class="form-header">
      <h1>Profile</h1>
    </div>

    <!-- Profile Avatar -->
    <div class="profile-avatar" id="avatar"></div>

    <!-- User Info -->
    <div class="profile-info-box">
      <p><strong>Name:</strong> <span id="name"></span></p>
      <p><strong>Email:</strong> <span id="email"></span></p>
    </div>

    <!-- Change Password -->
    <form onsubmit="changePassword(event)">

        <div class="form-group">
          <label for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword" class="form-input" placeholder="......" required>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-input" placeholder="......" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="......" required>
        </div>

      <div style="text-align:center"></div>
        <button type="submit" class="btn btn-primary" style="width : 100%">Update Password</button>
      </div>

    </form>

    <p id="msg"></p>

  </div>

</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if (user) {
  document.getElementById("name").innerText = user.name;
  document.getElementById("email").innerText = user.email;
  document.getElementById("avatar").innerText = user.name.charAt(0).toUpperCase();
}

function changePassword(e) {
  e.preventDefault();

  const current = document.getElementById("currentPassword").value;
  const newPass = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const msg = document.getElementById("msg");

  let storedUser = JSON.parse(localStorage.getItem("user"));

  if (!storedUser.password) storedUser.password = "1234";

  if (current !== storedUser.password) {
    msg.innerText = "❌ Wrong current password";
    msg.style.color = "red";
    return;
  }

  if (newPass !== confirm) {
    msg.innerText = "❌ Password mismatch";
    msg.style.color = "red";
    return;
  }

  storedUser.password = newPass;
  localStorage.setItem("user", JSON.stringify(storedUser));

  msg.innerText = "✅ Password updated";
  msg.style.color = "lightgreen";
}

function goBack() {
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
